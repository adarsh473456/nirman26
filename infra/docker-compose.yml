services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nirman
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nirman_postgres:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - nirman_elasticsearch:/usr/share/elasticsearch/data

volumes:
  nirman_postgres:
  nirman_elasticsearch:
